name: Build FDK-AAC

on:
  push:
    paths:
      - .github/workflows/build_fdk_aac.yml

  workflow_dispatch:
    inputs:
      release:
        description: "Create GitHub Release and upload binaries"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  FDK_REPOSITORY: mstorsjo/fdk-aac
  FDK_REF: v3.0.0

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            binary: fdk-aac

          - os: windows-2022
            platform: windows-x86_64
            binary: fdk-aac.exe

    steps:
      - name: Checkout FDK-AAC
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FDK_REPOSITORY }}
          ref: ${{ env.FDK_REF }}
          path: fdk-aac

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config

      - name: Setup Windows environment
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make
            autoconf
            automake
            libtool
            pkg-config

      - name: Build Linux
        if: runner.os == 'Linux'
        working-directory: fdk-aac
        run: |
          set -euxo pipefail
          ./autogen.sh
          ./configure --enable-example --disable-shared --enable-static
          make -j"$(nproc)"
          test -x aac-enc

      - name: Build Windows
        if: runner.os == 'Windows'
        working-directory: fdk-aac
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          ./autogen.sh
          LDFLAGS="-static" ./configure --enable-example --disable-shared --enable-static
          make -j"$(nproc)"
          test -f aac-enc.exe

      - name: Prepare Linux binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p output
          cp fdk-aac/aac-enc output/fdk-aac
          strip output/fdk-aac
          chmod +x output/fdk-aac
          file output/fdk-aac
          ldd output/fdk-aac || true
          ./output/fdk-aac --help || true
          ls -lh output/fdk-aac

      - name: Prepare Windows binary
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          mkdir -p output
          cp fdk-aac/aac-enc.exe output/fdk-aac.exe
          strip output/fdk-aac.exe
          file output/fdk-aac.exe
          ./output/fdk-aac.exe --help || true
          objdump -p output/fdk-aac.exe | grep "DLL Name" || true
          ls -lh output/fdk-aac.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdk-aac-${{ matrix.platform }}
          path: output/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    if: inputs.release == true
    runs-on: ubuntu-24.04

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: fdk-aac-*
          path: release
          merge-multiple: true

      - name: Verify binaries
        run: |
          set -eux
          test -f release/fdk-aac
          test -f release/fdk-aac.exe
          ls -lh release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: FDK-AAC v3.0.0
          generate_release_notes: true
          files: |
            release/fdk-aac
            release/fdk-aac.exe
