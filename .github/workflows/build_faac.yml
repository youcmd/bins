name: Build FAAC Linux

on:
  push:
    paths:
      - .github/workflows/build_faac.yml
  workflow_dispatch:
    inputs:
      release:
        description: "Create GitHub Release and upload binaries"
        required: true
        default: false
        type: boolean
      latest_commit:
        description: "Build from the latest commit instead of FAAC_REF"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  FAAC_REPOSITORY: FreewareAdvancedAudio/faac
  FAAC_REF: faac-2.2

jobs:
  build:
    name: Linux x86_64 Static
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout FAAC
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FAAC_REPOSITORY }}
          ref: ${{ github.event_name == 'push' && 'master' || (inputs.latest_commit && 'master' || env.FAAC_REF) }}
          path: faac
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build

      - name: Configure
        working-directory: faac
        run: |
          meson setup build \
            --buildtype=release \
            --default-library=static \
            -Dfrontend=true \
            -Dc_link_args=-static

      - name: Build
        working-directory: faac
        run: meson compile -C build

      - name: Verify
        working-directory: faac
        run: |
          for bin in faac faad faam; do
            echo "=== $bin ==="
            file "build/frontend/$bin"
            ldd "build/frontend/$bin" || true
            "build/frontend/$bin" -H || true
          done

      - name: Prepare binaries
        run: |
          set -e

          mkdir -p output

          for bin in faac faad faam; do
            cp "faac/build/frontend/$bin" "output/$bin"
            strip "output/$bin"
            chmod +x "output/$bin"
          done

          echo "=== Binary information ==="
          file output/faac output/faad output/faam

          echo "=== Binary sizes ==="
          ls -lh output/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: faac-linux-x86_64-static
          path: |
            output/*
          if-no-files-found: error

      - name: Create release
        if: inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: faac-2.2
          name: FAAC Linux x86_64
          generate_release_notes: true
          files: |
            output/*
