name: Build FAAC Linux

on:
  push:
    paths: .github/workflows/build_faac.yml
  workflow_dispatch:
    inputs:
      release:
        description: "Create GitHub Release and upload binary"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  FAAC_REPOSITORY: FreewareAdvancedAudio/faac
  FAAC_REF: faac-2.2

jobs:
  build:
    name: Linux x86_64 Static
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout FAAC
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FAAC_REPOSITORY }}
          ref: ${{ env.FAAC_REF }}
          path: faac
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build

      - name: Configure
        working-directory: faac
        run: meson setup build --buildtype=release --default-library=static -Dfrontend=true -Dc_link_args=-static

      - name: Build
        working-directory: faac
        run: meson compile -C build
        

      - name: Verify
        working-directory: faac
        run: |
          file build/frontend/faac
          ldd build/frontend/faac || true
          ./build/frontend/faac --help || true

      - name: Prepare binary
        run: |
          mkdir -p output
          cp faac/build/frontend/faac output/faac
          strip output/faac
          chmod +x output/faac
          file output/faac
          ls -lh output/faac

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: faac
          path: output/faac
          if-no-files-found: error

      - name: Create release
        if: inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: faac-2.2
          name: FAAC
          generate_release_notes: true
          files: output/faac
